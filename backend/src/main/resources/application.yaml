spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/bookfair
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: YOUR_GMAIL
    password: YOUR_APP_PASSWORD
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: 8080

jwt:
  secret: 'ChangeThisToAVeryLongRandomSecretKeyForHS512ChangeThisToAVeryLongRandomSecretKeyForHS512'
  expiration-minutes: 120

logging:
  level:
    root: INFO
    org.springframework.security: INFO
